    <script>

        // --------------------------------------------------
        // שלב 1: חיבור למסד הנתונים המקומי
        // --------------------------------------------------

        let db;

        const dbRequest = indexedDB.open("TravelJournalDB", 1);

        dbRequest.onupgradeneeded = function(event) {

            const database = event.target.result;

            if (!database.objectStoreNames.contains("days")) {

                database.createObjectStore("days", {
                    keyPath: "date"
                });

            }

        };


        dbRequest.onsuccess = function(event) {

            db = event.target.result;

        dbRequest.onerror = function() {

        const dateInput = document.getElementById("dayDate");

        const titleInput = document.getElementById("dayTitle");

        const storyInput = document.getElementById("dayStory");


        function getToday() {

            const now = new Date();

            const localDate = new Date(
                now.getTime() - now.getTimezoneOffset() * 60000
            );

            return localDate.toISOString().slice(0, 10);

        }


        document.getElementById("addDayButton").onclick = function() {

            dayForm.reset();

            dateInput.value = getToday();

            editor.style.display = "block";

            editor.scrollIntoView({

            });

        document.getElementById("cancelButton").onclick = function() {

            editor.style.display = "none";

        };

                return;

            }


            const transaction = db.transaction(
                ["days"],
                "readwrite"
            );

            const store = transaction.objectStore("days");

// התמונות החדשות שבחרנו

const newPhotos = Array.from(photosInput.files);

// בדיקה אם כבר קיימת רשומה בתאריך הזה

const existingDayRequest = store.get(day.date);

existingDayRequest.onsuccess = function() {

    const existingDay = existingDayRequest.result;

    // שמירת הרשומה והתמונות במסד הנתונים

};

existingDayRequest.onerror = function() {

    showStatus("לא ניתן לטעון את התמונות הקיימות. הרשומה לא נשמרה.");

};

            transaction.oncomplete = function() {

                editor.style.display = "none";

                showStatus("היום נשמר בהצלחה! ✅");

                loadDays();

            };


            transaction.onerror = function() {

                showStatus("אירעה שגיאה בשמירה. הרשומה לא נשמרה.");

        // --------------------------------------------------
        // שלב 4: הצגת הימים שנשמרו
        // --------------------------------------------------

        function loadDays() {

            if (!db) return;

            const transaction = db.transaction(
                ["days"],
                "readonly"
            );

            const store = transaction.objectStore("days");

            const request = store.getAll();


            request.onsuccess = function() {

                const days = request.result;

                days.sort(function(a, b) {

                    return b.date.localeCompare(a.date);

                });

                displayDays(days);

            };


            request.onerror = function() {

                showStatus("לא ניתן לטעון את הרשומות השמורות.");

            };

        };


        function displayDays(days) {

            const container = document.getElementById("daysContainer");

            container.replaceChildren();


            if (days.length === 0) {

                const emptyMessage = document.createElement("p");

                emptyMessage.className = "empty-message";

                emptyMessage.textContent =
                    "עדיין אין רשומות ביומן. הרפתקה חדשה מחכה לך!";

                container.appendChild(emptyMessage);

            }


            days.forEach(function(day) {

                const card = document.createElement("article");

                card.appendChild(date);

                card.appendChild(title);

}
                card.appendChild(editButton);

                container.appendChild(card);

            });

        };


        // --------------------------------------------------

        function editDay(day) {

        function showStatus(message) {

            document.getElementById("statusMessage").textContent = message;

        };
// הצגת תמונות שנבחרו

const photosInput = document.getElementById("dayPhotos");

const photosPreview = document.createElement("div");

photosPreview.style.display = "flex";
photosPreview.style.flexWrap = "wrap";
photosPreview.style.gap = "10px";
photosPreview.style.marginTop = "15px";

photosInput.after(photosPreview);

let previewUrls = [];

photosInput.addEventListener("change", function() {

    // ניקוי התמונות הקודמות מהתצוגה

    photosPreview.replaceChildren();

    previewUrls.forEach(function(url) {
        URL.revokeObjectURL(url);
    });

    previewUrls = [];

    // הצגת התמונות החדשות

    Array.from(photosInput.files).forEach(function(file) {

        const image = document.createElement("img");

        const imageUrl = URL.createObjectURL(file);

        previewUrls.push(imageUrl);

        image.src = imageUrl;

        image.style.width = "100px";
        image.style.height = "100px";
        image.style.objectFit = "cover";
        image.style.borderRadius = "10px";

        photosPreview.appendChild(image);

    });

});
// --------------------------------------------------
// יצירת קובץ גיבוי הכולל את הרשומות והתמונות
// --------------------------------------------------

// המרת תמונה למידע שאפשר לשמור בתוך קובץ JSON

function photoToDataURL(photo) {

    return new Promise(function(resolve, reject) {

        const reader = new FileReader();

        reader.onload = function() {
            resolve(reader.result);
        };

        reader.onerror = function() {
            reject(new Error("לא ניתן לקרוא את אחת התמונות."));
        };

        reader.readAsDataURL(photo);

    });

}


// קריאת כל הרשומות ממסד הנתונים

function getAllDaysForBackup() {

    return new Promise(function(resolve, reject) {

        if (!db) {

            reject(new Error("מסד הנתונים אינו זמין."));
            return;

        }

        const transaction = db.transaction(
            ["days"],
            "readonly"
        );

        const store = transaction.objectStore("days");

        const request = store.getAll();

        request.onsuccess = function() {
            resolve(request.result);
        };

        request.onerror = function() {
            reject(new Error("לא ניתן לקרוא את הרשומות."));
        };

    });

}


// יצירת קובץ הגיבוי והורדתו למכשיר

document.getElementById("backupButton").onclick = async function() {

    const button = document.getElementById("backupButton");

    button.disabled = true;

    button.textContent = "⏳ מכין את קובץ הגיבוי...";

    try {

        // שליפת כל הימים השמורים

        const days = await getAllDaysForBackup();

        if (days.length === 0) {

            alert("היומן עדיין ריק. אין רשומות לגיבוי.");

            return;

        }


        // הכנת הרשומות והתמונות לקובץ הגיבוי

        const backupDays = [];

        for (const day of days) {

            const backupPhotos = [];

            for (const photo of (day.photos || [])) {

                const photoData = await photoToDataURL(photo);

                backupPhotos.push({

                    name: photo.name || "photo",

                    type: photo.type || "image/jpeg",

                    lastModified: photo.lastModified || null,

                    data: photoData

                });

            }

            backupDays.push({

                date: day.date,

                title: day.title,

                story: day.story,

                photos: backupPhotos

            });

        }


        // יצירת מבנה קובץ הגיבוי

        const backup = {

            app: "TravelJournal",

            version: 1,

            createdAt: new Date().toISOString(),

            days: backupDays

        };


        // המרת המידע לקובץ JSON

        const json = JSON.stringify(backup);

        const backupFile = new Blob(
            [json],
            { type: "application/json" }
        );


        // יצירת קישור זמני להורדת הקובץ

        const downloadUrl = URL.createObjectURL(backupFile);

        const downloadLink = document.createElement("a");

        const today = new Date().toISOString().slice(0, 10);

        downloadLink.href = downloadUrl;

        downloadLink.download =
            "travel-journal-backup-" + today + ".json";

        document.body.appendChild(downloadLink);

        downloadLink.click();

        downloadLink.remove();


        // שחרור הקישור הזמני לאחר ההורדה

        setTimeout(function() {

            URL.revokeObjectURL(downloadUrl);

        }, 60000);


        showStatus(
            "קובץ הגיבוי הוכן. בדוק שהוא ירד למכשיר. 📦"
        );

    }

    catch (error) {

        console.error(error);

        alert(
            "אירעה שגיאה ביצירת הגיבוי. " +
            "נסה שוב וודא שקיים מספיק מקום פנוי במכשיר."
        );

    }

    finally {

        button.disabled = false;

        button.textContent = "📦 הורדת גיבוי ליומן";

    }

};

// פתיחת חלון בחירת קובץ הגיבוי

restoreButton.onclick = function() {

    restoreFileInput.value = "";

};


// בדיקת תקינות התאריך

function isValidBackupDate(date) {

    if (typeof date !== "string") {
        return false;
    }

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        return false;
    }

    const parsedDate = new Date(date + "T12:00:00Z");

    return !isNaN(parsedDate.getTime()) &&
        parsedDate.toISOString().slice(0, 10) === date;

}


// המרת תמונה מקובץ הגיבוי בחזרה לקובץ תמונה

async function restorePhoto(photo) {

    if (
        !photo ||
        typeof photo.data !== "string" ||
        !/^data:image\/[a-zA-Z0-9.+-]+;base64,/.test(photo.data)
    ) {

        throw new Error("אחת התמונות בקובץ הגיבוי אינה תקינה.");

    }

    const response = await fetch(photo.data);

    if (!response.ok) {

        throw new Error("לא ניתן לשחזר אחת מהתמונות.");

    }

    const blob = await response.blob();

    if (!blob.type.startsWith("image/")) {

        throw new Error("סוג קובץ התמונה אינו תקין.");

    }

    return new File(

        [blob],

        typeof photo.name === "string" ? photo.name : "photo",

        {
            type: blob.type,

            lastModified:
                Number.isFinite(photo.lastModified)
                    ? photo.lastModified
                    : Date.now()
        }

    );

}


// קריאת קובץ הגיבוי

restoreFileInput.onchange = async function() {

    const file = restoreFileInput.files[0];

    if (!file) return;

    if (!db) {

        alert("מסד הנתונים עדיין לא מוכן.");

        return;

    }

    restoreButton.disabled = true;

    restoreButton.textContent = "⏳ מכין את השחזור...";

    try {

        // קריאת הקובץ והמרתו למידע

        const fileContent = await file.text();

        const backup = JSON.parse(fileContent);


        // בדיקה שמדובר בקובץ גיבוי מתאים

        if (
            !backup ||
            backup.app !== "TravelJournal" ||
            backup.version !== 1 ||
            !Array.isArray(backup.days)
        ) {

            throw new Error("קובץ הגיבוי אינו מתאים לאפליקציה.");

        }


        // הכנת הרשומות והתמונות לשחזור

        const restoredDays = [];

        const datesInBackup = new Set();

        for (const day of backup.days) {

            if (
                !day ||
                !isValidBackupDate(day.date) ||
                typeof day.title !== "string" ||
                typeof day.story !== "string" ||
                !Array.isArray(day.photos) ||
                datesInBackup.has(day.date)
            ) {

                throw new Error(
                    "אחת הרשומות בקובץ הגיבוי אינה תקינה."
                );

            }

            datesInBackup.add(day.date);

            const restoredPhotos = [];

            for (const photo of day.photos) {

                const imageFile = await restorePhoto(photo);

                restoredPhotos.push(imageFile);

            }

            restoredDays.push({

                date: day.date,

                title: day.title,

                story: day.story,

                photos: restoredPhotos

            });

        }


        // בקשת אישור לפני ביצוע השחזור

        const approved = confirm(

            "נמצאו " + restoredDays.length + " רשומות בגיבוי.\n\n" +

            "רשומות מתאריכים שכבר קיימים ביומן לא יוחלפו.\n\n" +

            "האם להמשיך בשחזור?"

        );

        if (!approved) return;


        // שמירת הרשומות במסד הנתונים

        await new Promise(function(resolve, reject) {

            const transaction = db.transaction(
                ["days"],
                "readwrite"
            );

            const store = transaction.objectStore("days");

            let restoredCount = 0;

            let skippedCount = 0;


            restoredDays.forEach(function(day) {

                const request = store.get(day.date);

                request.onsuccess = function() {

                    if (request.result) {

                        // הרשומה כבר קיימת ולכן לא נחליף אותה

                        skippedCount++;

                    } else {

                        // הוספת רשומה חדשה למסד הנתונים

                        store.add(day);

                        restoredCount++;

                    }

                };

            });


            transaction.oncomplete = function() {

                resolve({

                    restored: restoredCount,

                    skipped: skippedCount

                });

            };


            transaction.onerror = function() {

                reject(
                    new Error("אירעה שגיאה בשמירת הרשומות.")
                );

            };

            transaction.onabort = function() {

                reject(
                    new Error("השחזור בוטל. ייתכן שאין מספיק שטח אחסון.")
                );

            };

        }).then(function(result) {

            showStatus(

                "השחזור הושלם! ✅ " +

                result.restored + " רשומות נוספו. " +

                result.skipped + " רשומות קיימות לא הוחלפו."

            );

        });


        // טעינת היומן המעודכן

        loadDays();

    }

    catch (error) {

        console.error(error);

        alert(

            "לא ניתן לשחזר את היומן.\n\n" +

            error.message +

            "\n\nהרשומות הקיימות לא נמחקו."

        );

    }

    finally {

        restoreButton.disabled = false;

        restoreButton.textContent =
            "📂 שחזור יומן מקובץ גיבוי";

    }

};

    window.addEventListener("load", function() {

        navigator.serviceWorker.register("./sw.js")

            .then(function(registration) {

                console.log(
                    "Service Worker registered successfully:",
                    registration.scope
                );

            })

            .catch(function(error) {

                console.error(
                    "Service Worker registration failed:",
                    error
                );

            });

    });

}
